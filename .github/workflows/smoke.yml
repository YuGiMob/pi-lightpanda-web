name: Live tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Lightpanda
        run: |
          echo "PI_LIGHTPANDA_E2E=1" >> "$GITHUB_ENV"
          echo "PI_LIGHTPANDA_E2E_BIN=$(bash scripts/install-lightpanda.sh --print-path --no-configure)" >> "$GITHUB_ENV"
      - run: npm run test:live
